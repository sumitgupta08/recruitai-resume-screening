<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RecruitAI — Resume Screening Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0f14;
  --surface: #141720;
  --surface2: #1c2030;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8eaf0;
  --muted: #7a8099;
  --accent: #6c8fff;
  --accent2: #a78bff;
  --green: #3ecf8e;
  --amber: #f5a623;
  --red: #ff5c5c;
  --cyan: #5ce8f5;
  --font: 'Outfit', sans-serif;
  --mono: 'DM Mono', monospace;
  --r: 10px;
  --r2: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }

/* ── Layout ── */
.shell { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
.sidebar {
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:24px 0;
  display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.main { padding:32px; overflow:auto; }

/* ── Sidebar ── */
.logo {
  padding:0 20px 24px;
  font-size:18px; font-weight:700;
  letter-spacing:-0.3px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;
}
.logo span { color:var(--accent); }
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 20px;
  cursor:pointer; border-radius:0;
  color:var(--muted); font-size:13.5px; font-weight:500;
  transition:all 0.15s;
}
.nav-item:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.nav-item.active { color:var(--accent); background:rgba(108,143,255,0.1); border-right:2px solid var(--accent); }
.nav-icon { font-size:16px; width:20px; text-align:center; }
.nav-section { font-size:10px; letter-spacing:1.2px; color:var(--muted); padding:16px 20px 6px; text-transform:uppercase; }

/* ── Top bar ── */
.topbar {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:28px;
}
.page-title { font-size:22px; font-weight:700; letter-spacing:-0.4px; }
.page-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.btn {
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 18px; border-radius:var(--r);
  font-family:var(--font); font-size:13px; font-weight:500;
  cursor:pointer; transition:all 0.15s; border:none;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#5a7df5; }
.btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border2); }
.btn-ghost:hover { color:var(--text); border-color:rgba(255,255,255,0.25); background:rgba(255,255,255,0.04); }
.btn-danger { background:rgba(255,92,92,0.15); color:var(--red); border:1px solid rgba(255,92,92,0.2); }

/* ── Stat cards ── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
.stat-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r2); padding:20px 22px;
}
.stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }
.stat-value { font-size:28px; font-weight:700; letter-spacing:-1px; }
.stat-delta { font-size:11.5px; margin-top:4px; }
.stat-delta.up { color:var(--green); }
.stat-delta.down { color:var(--red); }

/* ── Cards ── */
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r2); padding:22px;
}
.card-title { font-size:14px; font-weight:600; margin-bottom:16px; }

/* ── Upload zone ── */
.upload-zone {
  border:2px dashed var(--border2);
  border-radius:var(--r2); padding:48px;
  text-align:center; cursor:pointer;
  transition:all 0.2s;
  background:rgba(108,143,255,0.02);
}
.upload-zone:hover, .upload-zone.drag { border-color:var(--accent); background:rgba(108,143,255,0.06); }
.upload-icon { font-size:40px; margin-bottom:12px; }
.upload-text { font-size:15px; font-weight:500; }
.upload-sub { font-size:12.5px; color:var(--muted); margin-top:6px; }
.file-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(108,143,255,0.1); border:1px solid rgba(108,143,255,0.2);
  border-radius:6px; padding:4px 10px; font-size:12px;
  color:var(--accent); font-family:var(--mono);
}

/* ── Candidates table ── */
.table { width:100%; border-collapse:collapse; }
.table th {
  text-align:left; font-size:11px; text-transform:uppercase;
  letter-spacing:0.8px; color:var(--muted); padding:10px 12px;
  border-bottom:1px solid var(--border);
}
.table td { padding:13px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.table tr:last-child td { border-bottom:none; }
.table tr:hover td { background:rgba(255,255,255,0.02); }

/* ── Score badge ── */
.score-pill {
  display:inline-flex; align-items:center; justify-content:center;
  width:50px; height:26px; border-radius:6px;
  font-size:12.5px; font-weight:600; font-family:var(--mono);
}
.score-high { background:rgba(62,207,142,0.15); color:var(--green); }
.score-mid  { background:rgba(245,166,35,0.15); color:var(--amber); }
.score-low  { background:rgba(255,92,92,0.15);  color:var(--red); }

/* ── Progress bar ── */
.prog-bar { height:5px; background:var(--border2); border-radius:3px; overflow:hidden; width:100px; }
.prog-fill { height:100%; border-radius:3px; transition:width 0.4s; }
.prog-green { background:var(--green); }
.prog-accent { background:var(--accent); }
.prog-amber { background:var(--amber); }
.prog-red { background:var(--red); }

/* ── Tag ── */
.tag {
  display:inline-block; padding:2px 8px; border-radius:4px;
  font-size:11px; font-weight:500; margin:2px;
}
.tag-matched { background:rgba(62,207,142,0.12); color:var(--green); }
.tag-missing { background:rgba(255,92,92,0.12); color:var(--red); }
.tag-skill { background:rgba(108,143,255,0.12); color:var(--accent); }
.tag-status { background:rgba(255,255,255,0.08); color:var(--muted); }

/* ── XAI Panel ── */
.xai-panel {
  background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r); padding:16px; margin-top:12px;
  font-size:12.5px; line-height:1.7; color:var(--muted);
}
.xai-panel strong { color:var(--text); }

/* ── SHAP bars ── */
.shap-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.shap-label { width:120px; font-size:11.5px; color:var(--muted); flex-shrink:0; }
.shap-bar-wrap { flex:1; height:8px; background:var(--border2); border-radius:4px; overflow:hidden; }
.shap-bar { height:100%; border-radius:4px; transition:width 0.5s; }
.shap-pos { background:var(--green); }
.shap-neg { background:var(--red); float:right; }
.shap-val { width:40px; text-align:right; font-family:var(--mono); font-size:11px; color:var(--muted); }

/* ── Status dot ── */
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
.dot-green { background:var(--green); }
.dot-amber { background:var(--amber); }
.dot-red { background:var(--red); }
.dot-gray { background:var(--muted); }

/* ── Modal ── */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.65);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
.modal {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--r2); padding:28px; width:680px; max-width:95vw;
  max-height:90vh; overflow-y:auto;
}
.modal-title { font-size:17px; font-weight:600; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
.modal-close { cursor:pointer; color:var(--muted); font-size:20px; line-height:1; }

/* ── Form ── */
.form-label { font-size:12px; color:var(--muted); margin-bottom:5px; display:block; }
.form-input, .form-textarea, .form-select {
  width:100%; background:var(--bg); border:1px solid var(--border2);
  border-radius:var(--r); padding:9px 12px;
  color:var(--text); font-family:var(--font); font-size:13.5px;
  transition:border-color 0.15s;
  margin-bottom:14px;
}
.form-input:focus, .form-textarea:focus {
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(108,143,255,0.1);
}
.form-textarea { resize:vertical; min-height:120px; line-height:1.5; }

/* ── Tab ── */
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:20px; }
.tab {
  padding:10px 18px; font-size:13px; font-weight:500;
  cursor:pointer; color:var(--muted); border-bottom:2px solid transparent;
  transition:all 0.15s; margin-bottom:-1px;
}
.tab.active { color:var(--accent); border-color:var(--accent); }
.tab:hover:not(.active) { color:var(--text); }

/* ── Job card ── */
.job-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r2); padding:18px 20px;
  cursor:pointer; transition:all 0.15s; margin-bottom:10px;
}
.job-card:hover { border-color:var(--border2); background:var(--surface2); }
.job-card.selected { border-color:var(--accent); background:rgba(108,143,255,0.05); }
.job-title { font-size:15px; font-weight:600; margin-bottom:4px; }
.job-meta { font-size:12px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }

/* ── Animations ── */
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes spin { to { transform:rotate(360deg); } }
.fade-in { animation:fadeIn 0.3s ease; }
.spinner { width:16px; height:16px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; display:inline-block; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* ── Charts ── */
.score-ring { transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--border2); stroke-width:8; }
.ring-fg { fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dasharray 0.6s ease; }

/* ── Grid layouts ── */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo">Recruit<span>AI</span></div>
    <div class="nav-section">Main</div>
    <div class="nav-item active" onclick="navigate('dashboard')"><span class="nav-icon">⬡</span>Dashboard</div>
    <div class="nav-item" onclick="navigate('upload')"><span class="nav-icon">↑</span>Upload Resumes</div>
    <div class="nav-item" onclick="navigate('jobs')"><span class="nav-icon">◈</span>Job Descriptions</div>
    <div class="nav-item" onclick="navigate('rankings')"><span class="nav-icon">▤</span>Rankings</div>
    <div class="nav-section">Analysis</div>
    <div class="nav-item" onclick="navigate('insights')"><span class="nav-icon">◉</span>Insights</div>
    <div class="nav-item" onclick="navigate('gaps')"><span class="nav-icon">△</span>Skill Gaps</div>
    <div class="nav-section">Admin</div>
    <div class="nav-item" onclick="navigate('admin')"><span class="nav-icon">⚙</span>Admin Panel</div>
    <div style="flex:1"></div>
    <div style="padding:16px 20px; border-top:1px solid var(--border)">
      <div style="font-size:12px; color:var(--muted)">Logged in as</div>
      <div style="font-size:13px; font-weight:500; margin-top:2px">Recruiter Admin</div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main" id="main"></main>
</div>

<!-- Candidate Detail Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────
const state = {
  page: 'dashboard',
  selectedJob: null,
  uploadedFiles: [],
  candidates: generateCandidates(18),
  jobs: [
    {id:'j1', title:'Senior Backend Engineer', company:'TechCorp', location:'Remote', required_skills:['Python','FastAPI','PostgreSQL','Docker','Redis','AWS'], preferred_skills:['Kubernetes','Go'], required_experience_years:5, required_education:"Bachelor's", applications:18, active:true},
    {id:'j2', title:'ML Engineer', company:'DataAI Inc', location:'London', required_skills:['Python','PyTorch','TensorFlow','scikit-learn','Docker','SQL'], preferred_skills:['Kubernetes','Spark'], required_experience_years:3, required_education:"Master's", applications:12, active:true},
    {id:'j3', title:'Full-Stack Developer', company:'Startify', location:'NYC', required_skills:['React','TypeScript','Node.js','PostgreSQL','Docker'], preferred_skills:['GraphQL','Redis'], required_experience_years:2, required_education:"Bachelor's", applications:24, active:true},
  ],
};

function generateCandidates(n) {
  const names = ['Priya Sharma','James O\'Brien','Mei-Ling Chen','Arjun Kapoor','Sofia Rossi','Marcus Johnson','Fatima Al-Hassan','Dmitri Volkov','Amara Diallo','Chen Wei','Isabella Novak','Kwame Mensah','Nadia Petersen','Ravi Nair','Elena Kovacs','Omar Farouk','Yuki Tanaka','Laura Bianchi'];
  const skills_pool = ['Python','FastAPI','Docker','PostgreSQL','Redis','AWS','Kubernetes','Go','React','TypeScript','Node.js','GraphQL','TensorFlow','PyTorch','scikit-learn','Spark','Kafka','MongoDB'];
  return names.slice(0,n).map((name, i) => {
    const score = Math.round(45 + Math.random() * 52);
    const skills = skills_pool.filter(() => Math.random() > 0.55).slice(0,6+Math.floor(Math.random()*5));
    const matched = skills.slice(0, Math.floor(skills.length*0.7));
    const missing = skills_pool.filter(s => !skills.includes(s)).slice(0, Math.floor(Math.random()*4)+1);
    return {
      id: 'r'+i, name, score,
      skills, matched, missing,
      exp: Math.round(1 + Math.random() * 9),
      edu: ['Bachelor\'s','Master\'s','PhD'][Math.floor(Math.random()*3)],
      location: ['Remote','London','NYC','Berlin','Bangalore'][Math.floor(Math.random()*5)],
      status: score >= 75 ? 'shortlisted' : score >= 55 ? 'review' : 'rejected',
      skill_score: Math.min(100, score + Math.round((Math.random()-0.5)*20)),
      exp_score: Math.min(100, score + Math.round((Math.random()-0.5)*25)),
      edu_score: Math.min(100, score + Math.round((Math.random()-0.5)*15)),
      sem_score: Math.min(100, score + Math.round((Math.random()-0.5)*18)),
      parse_status: i < 15 ? 'done' : (i === 15 ? 'processing' : 'pending'),
      lang: 'en',
    };
  }).sort((a,b) => b.score - a.score).map((c,i) => ({...c, rank: i+1}));
}

// ── Navigation ─────────────────────────────────────────────────
function navigate(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => {
    if(el.onclick && el.onclick.toString().includes(`'${page}'`)) el.classList.add('active');
  });
  render();
}

function render() {
  const pages = { dashboard, upload, jobs, rankings, insights, gaps, admin };
  const fn = pages[state.page] || dashboard;
  document.getElementById('main').innerHTML = fn();
  bindEvents();
}

// ── Pages ─────────────────────────────────────────────────────
function dashboard() {
  const total = state.candidates.length;
  const shortlisted = state.candidates.filter(c => c.status==='shortlisted').length;
  const avgScore = Math.round(state.candidates.reduce((a,c) => a+c.score, 0)/total);
  const processed = state.candidates.filter(c => c.parse_status==='done').length;
  return `
    <div class="topbar">
      <div><div class="page-title">Dashboard</div><div class="page-sub">Overview of active recruitment pipeline</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="navigate('upload')">↑ Upload</button>
        <button class="btn btn-primary" onclick="navigate('jobs')">+ New Job</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card fade-in">
        <div class="stat-label">Total Resumes</div>
        <div class="stat-value">${total}</div>
        <div class="stat-delta up">↑ 4 this week</div>
      </div>
      <div class="stat-card fade-in">
        <div class="stat-label">Shortlisted</div>
        <div class="stat-value" style="color:var(--green)">${shortlisted}</div>
        <div class="stat-delta up">↑ 2 today</div>
      </div>
      <div class="stat-card fade-in">
        <div class="stat-label">Avg Score</div>
        <div class="stat-value" style="color:var(--accent)">${avgScore}</div>
        <div class="stat-delta up">↑ 3.2 pts vs last batch</div>
      </div>
      <div class="stat-card fade-in">
        <div class="stat-label">Parsed</div>
        <div class="stat-value">${processed}/${total}</div>
        <div class="stat-delta" style="color:var(--muted)">${Math.round(processed/total*100)}% complete</div>
      </div>
    </div>
    <div class="grid-2" style="gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-title">Score Distribution</div>
        ${scoreDistributionChart()}
      </div>
      <div class="card">
        <div class="card-title">Top Candidates</div>
        ${topCandidatesTable(5)}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Active Job Postings</div>
      ${state.jobs.map(j => `
        <div class="job-card" onclick="state.selectedJob='${j.id}';navigate('rankings')">
          <div class="job-title">${j.title}</div>
          <div class="job-meta">
            <span>🏢 ${j.company}</span>
            <span>📍 ${j.location}</span>
            <span>👤 ${j.applications} applicants</span>
            <span>⏱ ${j.required_experience_years}+ yrs</span>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function scoreDistributionChart() {
  const buckets = [0,0,0,0,0];
  state.candidates.forEach(c => {
    if(c.score < 40) buckets[0]++;
    else if(c.score < 55) buckets[1]++;
    else if(c.score < 70) buckets[2]++;
    else if(c.score < 85) buckets[3]++;
    else buckets[4]++;
  });
  const max = Math.max(...buckets) || 1;
  const labels = ['< 40','40-55','55-70','70-85','85+'];
  const colors = ['var(--red)','var(--amber)','var(--muted)','var(--accent)','var(--green)'];
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px">
    ${buckets.map((b,i) => `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="font-size:11px;color:var(--muted)">${b}</div>
        <div style="width:100%;background:${colors[i]};border-radius:4px 4px 0 0;height:${Math.round(b/max*90)}px;opacity:0.8;min-height:4px"></div>
        <div style="font-size:10px;color:var(--muted)">${labels[i]}</div>
      </div>`).join('')}
  </div>`;
}

function topCandidatesTable(n) {
  return `<table class="table">
    <thead><tr><th>#</th><th>Candidate</th><th>Score</th><th>Status</th></tr></thead>
    <tbody>${state.candidates.slice(0,n).map(c => `
      <tr style="cursor:pointer" onclick="showCandidate('${c.id}')">
        <td><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${c.rank}</span></td>
        <td>
          <div style="font-weight:500">${c.name}</div>
          <div style="font-size:11.5px;color:var(--muted)">${c.exp} yrs · ${c.edu}</div>
        </td>
        <td>${scorePill(c.score)}</td>
        <td><span class="tag tag-status">${c.status}</span></td>
      </tr>`).join('')}
    </tbody></table>`;
}

function upload() {
  return `
    <div class="topbar">
      <div><div class="page-title">Upload Resumes</div><div class="page-sub">PDF and DOCX files, up to 10MB each</div></div>
    </div>
    <div class="grid-2" style="gap:16px">
      <div class="card">
        <div class="card-title">Single or Batch Upload</div>
        <div class="upload-zone" id="dropzone" onclick="document.getElementById('fileInput').click()"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="handleDrop(event)">
          <div class="upload-icon">⬆</div>
          <div class="upload-text">Drop files here or click to browse</div>
          <div class="upload-sub">PDF / DOCX · Max 10MB · Up to 50 files at once</div>
          <input type="file" id="fileInput" style="display:none" multiple accept=".pdf,.docx" onchange="handleFiles(this.files)"/>
        </div>
        <div id="file-list" style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px"></div>
        <div id="upload-btn-wrap" style="margin-top:14px;display:none">
          <button class="btn btn-primary" onclick="simulateUpload()">↑ Upload All Files</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Processing Queue</div>
        ${state.candidates.slice(0,8).map(c => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-size:13px;font-weight:500">${c.name || c.id}</div>
              <div style="font-size:11.5px;color:var(--muted);font-family:var(--mono)">resume_${c.id}.pdf</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              ${c.parse_status === 'done' ? '<span class="dot dot-green"></span><span style="font-size:12px;color:var(--green)">Parsed</span>'
                : c.parse_status === 'processing' ? '<div class="spinner"></div><span style="font-size:12px;color:var(--amber)">Parsing…</span>'
                : '<span class="dot dot-gray"></span><span style="font-size:12px;color:var(--muted)">Queued</span>'}
            </div>
          </div>`).join('')}
      </div>

}

function handleFiles(files) {
  const list = document.getElementById('file-list');
  const btnWrap = document.getElementById('upload-btn-wrap');
  list.innerHTML = Array.from(files).map(f =>
    `<span class="file-badge">${f.name.length > 24 ? f.name.slice(0,21)+'…' : f.name}</span>`
  ).join('');
  btnWrap.style.display = files.length ? 'block' : 'none';
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('drag');
  handleFiles(e.dataTransfer.files);
}

function simulateUpload() {
  const btn = document.querySelector('#upload-btn-wrap .btn');
  btn.innerHTML = '<div class="spinner"></div> Uploading…';
  btn.disabled = true;
  setTimeout(() => { btn.innerHTML = '✓ Uploaded'; btn.style.background = 'var(--green)'; }, 1800);
}

    <div class="topbar">

    </div>
    <div class="tabs">
      ${tabs.map(t => `<div class="tab ${activeTab===t?'active':''}" onclick="state.rankTab='${t}';render()">${t}

          t==='All' ? state.candidates.length :

    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="table">
        <thead><tr>

        <tbody>
          ${filtered.map((c, i) => `

              </td>
              <td>${scorePill(c.score)}</td>
              <td><div style="display:flex;align-items:center;gap:6px"><div class="prog-bar"><div class="prog-fill prog-accent" style="width:${c.skill_score}%"></div></div><span style="font-size:11px;color:var(--muted)">${c.skill_score}</span></div></td>
              <td><div style="display:flex;align-items:center;gap:6px"><div class="prog-bar"><div class="prog-fill prog-green" style="width:${c.exp_score}%"></div></div><span style="font-size:11px;color:var(--muted)">${c.exp_score}</span></div></td>
              <td><div style="display:flex;align-items:center;gap:6px"><div class="prog-bar"><div class="prog-fill prog-amber" style="width:${c.sem_score}%"></div></div><span style="font-size:11px;color:var(--muted)">${c.sem_score}</span></div></td>
              <td><div style="max-width:200px">${c.matched.slice(0,3).map(s => `<span class="tag tag-matched">${s}</span>`).join('')}${c.matched.length>3?`<span class="tag tag-status">+${c.matched.length-3}</span>`:''}</div></td>

function insights() {
  const avg = f => Math.round(state.candidates.reduce((a,c) => a+(c[f]||0), 0)/state.candidates.length);
  return `
    <div class="topbar"><div><div class="page-title">Pipeline Insights</div><div class="page-sub">Aggregate analytics across all candidates</div></div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Avg Skill Score</div><div class="stat-value" style="color:var(--accent)">${avg('skill_score')}</div></div>
      <div class="stat-card"><div class="stat-label">Avg Experience Score</div><div class="stat-value" style="color:var(--green)">${avg('exp_score')}</div></div>
      <div class="stat-card"><div class="stat-label">Avg Education Score</div><div class="stat-value" style="color:var(--accent2)">${avg('edu_score')}</div></div>
      <div class="stat-card"><div class="stat-label">Avg Semantic Score</div><div class="stat-value" style="color:var(--amber)">${avg('sem_score')}</div></div>
    </div>
    <div class="grid-2" style="gap:16px">
      <div class="card">
        <div class="card-title">Score Components — Average Contribution</div>
        ${['Skills','Experience','Education','Semantic'].map((label,i) => {
          const vals = [avg('skill_score'), avg('exp_score'), avg('edu_score'), avg('sem_score')];
          const colors = ['var(--accent)','var(--green)','var(--accent2)','var(--amber)'];
          return `<div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
              <span>${label}</span><span style="color:${colors[i]};font-family:var(--mono)">${vals[i]}/100</span>
            </div>
            <div style="height:8px;background:var(--border2);border-radius:4px;overflow:hidden">
              <div style="height:100%;background:${colors[i]};border-radius:4px;width:${vals[i]}%"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-title">Experience Distribution</div>
        ${scoreDistributionChart()}
        <div style="margin-top:14px">
          <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Language Distribution</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:10px;background:var(--accent);border-radius:4px"></div>
            <span style="font-size:12px">English (94%)</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <div style="width:20px;height:10px;background:var(--green);border-radius:4px"></div>
            <span style="font-size:12px">French (4%)</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <div style="width:10px;height:10px;background:var(--amber);border-radius:4px"></div>
            <span style="font-size:12px">Other (2%)</span>
          </div>
        </div>
      </div>
    </div>`;
}

function gaps() {
  const allMissing = {};
  state.candidates.forEach(c => c.missing.forEach(s => { allMissing[s] = (allMissing[s]||0)+1; }));
  const sorted = Object.entries(allMissing).sort((a,b) => b[1]-a[1]).slice(0,12);
  return `
    <div class="topbar"><div><div class="page-title">Skill Gap Analysis</div><div class="page-sub">Most frequently missing skills across candidates</div></div></div>
    <div class="card">
      <div class="card-title">Common Skill Gaps</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${sorted.map(([skill, count]) => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${skill}</div>
              <div style="height:4px;background:var(--border2);border-radius:2px;margin-top:5px;overflow:hidden">
                <div style="height:100%;background:var(--red);border-radius:2px;width:${Math.round(count/state.candidates.length*100)}%"></div>
              </div>
            </div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--red)">${count}/${state.candidates.length}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

  return `
    <div class="topbar"><div><div class="page-title">Admin Panel</div><div class="page-sub">System settings and recruiter management</div></div></div>
    <div class="grid-2" style="gap:16px">
      <div class="card">
        <div class="card-title">Scoring Weights</div>
        ${[['Skills Weight','WEIGHT_SKILLS',40],['Experience Weight','WEIGHT_EXPERIENCE',30],['Education Weight','WEIGHT_EDUCATION',15],['Semantic Weight','WEIGHT_SEMANTIC',15]].map(([label, key, val]) => `
          <div style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">

            </div>
            <input type="range" min="0" max="60" value="${val}" style="width:100%" oninput="document.getElementById('val-${key}').textContent=this.value+'%'">
          </div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-primary" style="flex:1">Save Weights</button>
          <button class="btn btn-ghost">Reset</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">System Status</div>
        ${[['API Server','Healthy','green'],['PostgreSQL','Healthy','green'],['Redis','Healthy','green'],['Celery Workers','2 active','green'],['MinIO Storage','Healthy','green'],['Parse Queue','0 pending','green']].map(([name, status, color]) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:13px">${name}</span>
            <span style="font-size:12px;color:var(--${color});display:flex;align-items:center;gap:5px"><span class="dot dot-${color}"></span>${status}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">Bias Reduction Settings</div>

        ${[['Remove gender pronouns from scoring','true'],['Anonymize candidate names','false'],['Education institution name blinding','false'],['Age inference detection','true']].map(([label, def]) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:13px">${label}</span>
            <label style="position:relative;display:inline-block;width:36px;height:20px">
              <input type="checkbox" ${def==='true'?'checked':''} style="opacity:0;width:0;height:0">
              <span style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:${def==='true'?'var(--accent)':'var(--border2)'};border-radius:10px;transition:0.2s"></span>
            </label>
          </div>`).join('')}

}

// ── Candidate Detail Modal ────────────────────────────────────
function showCandidate(id) {
  const c = state.candidates.find(c => c.id === id);
  if(!c) return;
  const shap = [
    {label:'Skills', val: (c.skill_score-50)*0.4, color:'var(--accent)'},
    {label:'Experience', val: (c.exp_score-50)*0.3, color:'var(--green)'},
    {label:'Education', val: (c.edu_score-50)*0.15, color:'var(--accent2)'},
    {label:'Semantic', val: (c.sem_score-50)*0.15, color:'var(--amber)'},
  ];
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">
      <div>${c.name} <span style="font-size:13px;color:var(--muted);font-weight:400">· Rank #${c.rank}</span></div>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)">
      <svg width="80" height="80" viewBox="0 0 80 80"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring-fg score-ring" cx="40" cy="40" r="34"
        stroke="${c.score>=70?'var(--green)':c.score>=50?'var(--amber)':'var(--red)'}"
        stroke-dasharray="${Math.round(c.score/100*213.6)} 213.6"/></svg>
      <div style="margin-left:-8px;margin-top:-70px;text-align:center;width:80px;position:absolute">
        <div style="font-size:22px;font-weight:700;font-family:var(--mono)">${c.score}</div>
        <div style="font-size:10px;color:var(--muted)">/ 100</div>
      </div>
      <div style="margin-left:8px">
        <div style="font-size:15px;font-weight:500">${c.name}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:3px">${c.exp} years exp · ${c.edu}</div>
        <div style="font-size:12.5px;color:var(--muted)">${c.location} · ${c.lang.toUpperCase()}</div>
        <div style="margin-top:8px"><span class="tag ${c.status==='shortlisted'?'tag-matched':c.status==='review'?'tag-missing':'tag-status'}">${c.status}</span></div>
      </div>
    </div>
    <div class="tabs" style="margin-bottom:16px">
      <div class="tab active" id="tab-scores" onclick="switchTab('scores')">Score Breakdown</div>
      <div class="tab" id="tab-xai" onclick="switchTab('xai')">Explanation (XAI)</div>
      <div class="tab" id="tab-skills" onclick="switchTab('skills')">Skills & Gaps</div>
    </div>
    <div id="tab-content-scores">
      ${[['Skills',c.skill_score,'accent'],['Experience',c.exp_score,'green'],['Education',c.edu_score,'accent2'],['Semantic',c.sem_score,'amber']].map(([label,val,color]) => `
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px">
            <span>${label}</span><span style="color:var(--${color});font-family:var(--mono)">${val}/100</span>
          </div>
          <div style="height:8px;background:var(--border2);border-radius:4px;overflow:hidden">
            <div style="height:100%;background:var(--${color});border-radius:4px;width:${val}%"></div>
          </div>
        </div>`).join('')}
      <div style="margin-top:18px"><div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">SHAP Contributions</div>
        ${shap.map(s => `
          <div class="shap-row">
            <div class="shap-label">${s.label}</div>
            <div class="shap-bar-wrap">
              ${s.val >= 0
                ? `<div class="shap-bar shap-pos" style="width:${Math.min(Math.abs(s.val)*2,100)}%"></div>`
                : `<div class="shap-bar shap-neg" style="width:${Math.min(Math.abs(s.val)*2,100)}%"></div>`}
            </div>
            <div class="shap-val" style="color:${s.val>=0?'var(--green)':'var(--red)'}">${s.val>=0?'+':''}${s.val.toFixed(1)}</div>
          </div>`).join('')}
      </div>
    </div>
    <div id="tab-content-xai" style="display:none">
      <div class="xai-panel">
        <strong>Decision: ${c.score>=70?'SHORTLISTED':c.score>=50?'REVIEW':'REJECTED'}</strong> (Score: ${c.score}/100)<br><br>
        ${c.name} scored ${c.score}/100 based on four weighted dimensions:<br><br>
        <strong>Skills Match (40%):</strong> ${c.skill_score}/100<br>
        Matched: ${c.matched.join(', ')}.<br>
        Missing: ${c.missing.join(', ')}.<br><br>
        <strong>Experience (30%):</strong> ${c.exp_score}/100<br>
        Has ${c.exp} years of experience${c.exp >= 5 ? ' — meets threshold' : ' — below required 5 years'}.<br><br>
        <strong>Education (15%):</strong> ${c.edu_score}/100<br>
        Highest qualification: ${c.edu}.<br><br>
        <strong>Semantic Relevance (15%):</strong> ${c.sem_score}/100<br>
        Contextual alignment between resume content and job description.
      </div>
    </div>
    <div id="tab-content-skills" style="display:none">
      <div style="margin-bottom:14px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.8px">All Skills</div>
        <div>${c.skills.map(s => `<span class="tag tag-skill">${s}</span>`).join('')}</div>
      </div>
      <div style="margin-bottom:14px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.8px">Matched Required Skills</div>
        <div>${c.matched.map(s => `<span class="tag tag-matched">✓ ${s}</span>`).join('')}</div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.8px">Missing Skills (Gap)</div>
        <div>${c.missing.map(s => `<span class="tag tag-missing">✗ ${s}</span>`).join('')}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-primary" onclick="setState('${id}','shortlisted')">✓ Shortlist</button>
      <button class="btn btn-ghost" onclick="setState('${id}','review')">⏸ Review Later</button>
      <button class="btn btn-danger" onclick="setState('${id}','rejected')">✗ Reject</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

function switchTab(tab) {
  ['scores','xai','skills'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-content-'+t).style.display = t===tab ? 'block' : 'none';
  });
}

function setState(id, status) {
  const c = state.candidates.find(c => c.id === id);
  if(c) { c.status = status; closeModal(); render(); }
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function showJobModal() {
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title"><div>Create Job Description</div><span class="modal-close" onclick="closeModal()">✕</span></div>
    <label class="form-label">Job Title *</label>
    <input class="form-input" placeholder="e.g. Senior Backend Engineer"/>
    <label class="form-label">Company</label>
    <input class="form-input" placeholder="Company name"/>
    <label class="form-label">Description *</label>
    <textarea class="form-textarea" placeholder="Describe the role, responsibilities, and requirements…"></textarea>
    <label class="form-label">Required Skills (comma-separated)</label>
    <input class="form-input" placeholder="Python, FastAPI, Docker, PostgreSQL"/>
    <div class="grid-2" style="gap:10px">
      <div><label class="form-label">Experience (years)</label><input class="form-input" type="number" placeholder="3"/></div>
      <div><label class="form-label">Education</label><input class="form-input" placeholder="Bachelor's"/></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-primary" style="flex:1" onclick="closeModal()">Create Job</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

// ── Helpers ───────────────────────────────────────────────────
function scorePill(score) {
  const cls = score >= 70 ? 'score-high' : score >= 50 ? 'score-mid' : 'score-low';
  return `<span class="score-pill ${cls}">${score}</span>`;
}

function bindEvents() {}

// ── Boot ──────────────────────────────────────────────────────
render();
</script>
