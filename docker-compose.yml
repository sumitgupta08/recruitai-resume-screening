version: "3.9"

# ── Networks ──────────────────────────────────────────────────
networks:
  recruitai:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:

# ── Shared backend config ─────────────────────────────────────
x-backend-env: &backend-env
  env_file: ./backend/.env
  volumes:
    - model_cache:/root/.cache  # shared HuggingFace model cache
  networks:
    - recruitai

services:
  # ── PostgreSQL with pgvector ─────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - recruitai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - recruitai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    networks:
      - recruitai
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery: Parse worker ──────────────────────────────────────
  worker-parse:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.tasks.celery_app worker -Q parsing -c 2 --loglevel=info
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G  # NLP models are heavy

  # ── Celery: Score worker ──────────────────────────────────────
  worker-score:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.tasks.celery_app worker -Q scoring -c 4 --loglevel=info

  # ── Celery Flower monitoring ──────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - redis
    command: celery -A app.tasks.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"

  # ── React Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - recruitai
    depends_on:
      - api

  # ── Nginx reverse proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - recruitai
    depends_on:
      - api
      - frontend

  # ── Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./nginx/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - recruitai

  # ── Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    networks:
      - recruitai
    depends_on:
      - prometheus
